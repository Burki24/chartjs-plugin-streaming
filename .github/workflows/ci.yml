name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.0
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run package
      - run: git diff --exit-code -- dist package-lock.json

  # Keep the inherited documentation check visible and blocking. Its existing
  # unpublished-package/version-menu failure needs a separate documentation fix.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.0
      - run: npm ci --ignore-scripts
      - run: npm run docs
