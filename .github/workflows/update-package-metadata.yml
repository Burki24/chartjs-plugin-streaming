name: Update package metadata

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-package-metadata-dev
  cancel-in-progress: false

jobs:
  update-package-metadata:
    if: >-
      github.repository == 'Burki24/chartjs-plugin-streaming' &&
      github.ref == 'refs/heads/dev' &&
      !startsWith(github.event.head_commit.message, 'CHORE: Update package metadata')
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.HELPER_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.HELPER_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Skip superseded source commits
        id: source
        shell: bash
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [[ "$remote_sha" == "$SOURCE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev has advanced; its metadata run will include all pending commits."
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.source.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.source.outputs.current == 'true'
        run: npm install --global npm@11.21.0
      - if: steps.source.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - if: steps.source.outputs.current == 'true'
        run: node scripts/update-package-metadata.cjs
      - if: steps.source.outputs.current == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.source.outputs.current == 'true'
        run: npm run verify
      - name: Commit validated metadata and bundles
        if: steps.source.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Metadata is already current."
            exit 0
          fi
          remote_sha=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "dev advanced during verification; no stale metadata will be pushed."
            exit 0
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          version=$(node -p "require('./package.json').version")
          git add package.json package-lock.json \
            dist/@qultoltd/chartjs-plugin-streaming.js \
            dist/@qultoltd/chartjs-plugin-streaming.min.js \
            dist/@qultoltd/chartjs-plugin-streaming.esm.js
          git commit -m "CHORE: Update package metadata to v${version} (${SOURCE_SHA:0:7})"
          # Ordinary fast-forward push only: a concurrent owner push must never be overwritten.
          git push origin HEAD:refs/heads/dev
